# Realm map generation (PLAN §2.6). Bump `version` whenever output would change for an existing seed.
version: 4            # v4 (Phase 10): all six biome rings; v3 added waystones
map_size: 768          # tiles per side
chunk_size: 16
hub_radius: 18
plot:
  count: 10
  ring_radius: 110
  frame: 48            # every plot reserves a 48×48 frame (D-033)
  start_size: 32
  max_size: 48
  expand_step: 4
  clear_margin: 1      # tiles around the frame kept free of trees/rocks
  pond: { x: 10, y: 33, w: 6, h: 4 }   # frame coordinates, inside the starting square
meadow:
  flower_patch_threshold: 0.72
  tree_density_near: 0.035             # per tile, just outside plots
  tree_density_far: 0.080              # per tile, at the meadow's outer edge
  rock_density: 0.006
  bush_density: 0.02
  tall_grass_density: 0.03
bands:                                 # biome rings past the meadow, by noise-warped distance from the hub (PLAN §2.6)
  - { biome: forest,    radius: 175 }  # Whispering Forest (difficulty 2)
  - { biome: stonepeak, radius: 215 }  # 3
  - { biome: swamp,     radius: 255 }  # 4: Murkwater Swamp
  - { biome: frozen,    radius: 295 }  # 5: the Frozen North
  - { biome: ashen,     radius: 335 }  # 6: the Ashen Wastes
forest:
  radius: 175                          # Whispering Forest starts this far from the hub (BALANCE §6)
  tree_density: 0.16                   # per tile on the walkable lattice
  clearing_threshold: 0.7              # noise above this = sunny clearing
