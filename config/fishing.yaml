# Fishing (Phase 16b, BALANCE §11.2). Stand next to water (or ice, or lava in the Ashen Wastes),
# press E to cast. After a bite the timing bar runs once: press when the marker is in the zone.
#
# The server rolls the fish and the bite, times the bar against its own clock, and checks your press
# (D-115). Every species becomes a stackable bag item (category fish) with a market price; each catch
# also has a weight, and your heaviest of each species is a record in the Trophy Hall.

cast:
  reach: 1.6            # tiles from you to the nearest fishable tile
  bite: [1.5s, 4.5s]    # wait before a bite
  bar: 1.8s             # how long the marker takes to cross the bar
  slack: 0.06s          # forgiveness either side of the zone, for frame timing
  latency: 0.9s         # how late a press may arrive (network, slow frames on phones) and still count
  every: 1s             # between casts
  xp: 6                 # per catch (×2 rare, ×5 legendary)

windows:                # the zone's width, by rarity (BALANCE: 300 ms at the easiest, 120 for legendaries)
  common: 0.30s
  uncommon: 0.22s
  rare: 0.16s
  legendary: 0.12s

weights:                # chance of each rarity when a bite comes (only rarities a spot has are rolled)
  common: 70
  uncommon: 22
  rare: 7
  legendary: 1

waters:                 # which tiles you can fish, and the species there, by biome
  meadow:    { tiles: [water], species: [minnow, sunfish, perch, golden_carp, sunscale] }
  forest:    { tiles: [water], species: [trout, pike, perch, moonfin, blossom_trout] }
  stonepeak: { tiles: [water], species: [char, stone_loach, trout, crystal_koi] }
  swamp:     { tiles: [water], species: [catfish, bog_eel, mudskipper, lantern_gar, old_whiskers] }
  frozen:    { tiles: [water, ice], species: [icefish, frost_salmon, aurora_cod] }
  ashen:     { tiles: [lava], species: [cinder_eel, ash_crab, magma_ray] }

