# Buildings. See docs/BALANCE.md §2.
#
# Costs: a building lists its level-1 `base_cost`; levels 2–5 are derived from `level_curve`
# (multiplier, extra coins, planks/bricks conversion from level 3, rare requirement at level 5).
# A building can instead list explicit `levels:` (the Town Hall does).
# `max_count` is indexed by Town Hall level 1..5. `produces` is units/hour per level 1..5.

level_curve:
  times:      [10s, 45s, 5m, 15m, 40m]      # time to reach level 1 (build), 2, 3, 4, 5
  cost_mult:  [1, 2.5, 6, 14, 30]
  extra_coins: [0, 0, 100, 400, 1200]
  intermediates_from_level: 3               # half of wood → planks, half of stone → bricks
  intermediates:
    wood: { item: planks, ratio: 2 }
    stone: { item: bricks, ratio: 2 }
  rare_at_level: 5
  rare_cost:                                 # by building `rare_group`
    default:  { ironbark: 4 }
    crafting: { starstone: 4 }

buildings:
  town_hall:
    name: Town Hall
    description: The heart of your village. Its level caps every other building and unlocks new ones.
    category: core
    footprint: [4, 4]
    max_count: [1, 1, 1, 1, 1]
    demolishable: false
    storage_base: [1000, 1500, 2000, 2500, 3000]   # base storage cap per resource, by TH level
    levels:
      - { cost: {}, time: 0s }
      - { cost: { wood: 200, stone: 150, coins: 100 }, time: 55s }
      - { cost: { wood: 600, stone: 500, ore: 150, coins: 400 }, time: 8m }
      - { cost: { planks: 800, bricks: 700, ore: 500, coins: 1200, ironbark: 5 }, time: 20m }
      - { cost: { planks: 2000, bricks: 1750, ore: 1400, crystal: 40, coins: 4000, starstone: 5 }, time: 45m }

  house:
    name: House
    description: Homes for your villagers.
    category: core
    footprint: [3, 3]
    max_count: [3, 5, 7, 9, 12]
    base_cost: { wood: 50, stone: 20 }
    housing: [2, 3, 4, 5, 6]

  storehouse:
    name: Storehouse
    description: Raises how much of each resource you can store.
    category: core
    footprint: [3, 3]
    max_count: [1, 1, 1, 1, 1]
    base_cost: { wood: 100, stone: 80 }
    storage_bonus: [1000, 2500, 5000, 9000, 15000]

  market:
    name: Market
    description: Sell goods for coins. Prices move with what everyone sells; each level pays a little more.
    category: core
    footprint: [4, 3]
    max_count: [1, 1, 1, 1, 1]
    base_cost: { wood: 120, stone: 80 }
    sell_bonus: [0, 0.02, 0.04, 0.06, 0.08]

  lumber_camp:
    name: Lumber Camp
    description: Woodcutters fell trees for a steady supply of wood.
    category: production
    footprint: [3, 3]
    max_count: [1, 2, 2, 3, 3]
    base_cost: { wood: 40, stone: 20 }
    produces: { wood: [60, 100, 160, 240, 350] }

  quarry:
    name: Quarry
    description: Cuts stone from the earth.
    category: production
    footprint: [3, 3]
    max_count: [1, 1, 2, 2, 3]
    base_cost: { wood: 50 }
    produces: { stone: [50, 85, 135, 200, 290] }

  farm:
    name: Farm
    description: Grows food. From level 2 its animals also give hide.
    category: production
    footprint: [4, 4]
    max_count: [1, 2, 2, 3, 3]
    base_cost: { wood: 40, stone: 10 }
    produces:
      food: [60, 100, 160, 240, 350]
      hide: [0, 6, 10, 16, 24]

  mine:
    name: Mine
    description: Digs ore. Deeper levels strike crystal.
    category: production
    unlock_town_hall: 2
    footprint: [3, 3]
    max_count: [0, 1, 1, 2, 2]
    base_cost: { wood: 60, stone: 40 }
    produces:
      ore: [30, 50, 80, 120, 175]
      crystal: [0, 0, 4, 8, 14]

  fishing_dock:
    name: Fishing Dock
    description: Catches fish. Must touch water.
    category: production
    unlock_town_hall: 2
    footprint: [3, 4]
    requires_water: true
    max_count: [0, 1, 1, 1, 2]
    base_cost: { wood: 60, stone: 20 }
    produces: { fish: [20, 35, 55, 80, 115] }

  herb_garden:
    name: Herb Garden
    description: Grows herbs for potions.
    category: production
    unlock_town_hall: 2
    footprint: [3, 3]
    max_count: [0, 1, 1, 2, 2]
    base_cost: { wood: 40, stone: 20 }
    produces: { herbs: [25, 40, 65, 95, 140] }

  forge:
    name: Forge
    description: Smelts ingots. Placed next to the right buildings, it forges weapons and armour.
    category: crafting
    rare_group: crafting
    footprint: [3, 3]
    max_count: [1, 1, 1, 2, 2]
    base_cost: { wood: 80, stone: 120, ore: 20 }

  workshop:
    name: Workshop
    description: Turns wood into planks and stone into bricks.
    category: crafting
    rare_group: crafting
    unlock_town_hall: 2
    footprint: [3, 3]
    max_count: [0, 1, 1, 1, 1]
    base_cost: { wood: 120, stone: 60 }

  tannery:
    name: Tannery
    description: Cures hides into leather. Leatherworkers like a workshop next door.
    category: crafting
    rare_group: crafting
    unlock_town_hall: 3
    footprint: [3, 3]
    max_count: [0, 0, 1, 1, 1]
    base_cost: { wood: 100, stone: 40, hide: 20 }

  # Phase 11: alchemy, arcana and ale (BALANCE §2.3)
  alchemist:
    name: Alchemist
    description: Brews potion base from herbs. Beside the right neighbours it brews potions and hearty food.
    category: crafting
    rare_group: crafting
    unlock_town_hall: 2
    footprint: [2, 2]
    max_count: [0, 1, 1, 1, 1]
    base_cost: { wood: 100, stone: 80, herbs: 30 }

  wizard_tower:
    name: Wizard Tower
    description: Studies crystal. Its neighbours learn to make staffs, enchanted blades and tomes.
    category: crafting
    rare_group: crafting
    unlock_town_hall: 3
    footprint: [2, 2]
    max_count: [0, 0, 1, 1, 1]
    base_cost: { wood: 80, stone: 150, crystal: 20 }

  tavern:
    name: Tavern
    description: Bakes bread from food. Folks gather here, and so do barrels of things that go boom.
    category: crafting
    rare_group: crafting
    unlock_town_hall: 3
    footprint: [3, 2]
    max_count: [0, 0, 1, 1, 1]
    base_cost: { wood: 150, stone: 80, food: 50 }

  # ── Phase 13: defence ────────────────────────────────────────────────────────
  guard_post:
    name: Guard Post
    description: Villagers posted here stand guard when monsters raid. Each level hires more and trains them harder.
    category: defence
    unlock_town_hall: 2
    footprint: [2, 2]
    max_count: [0, 1, 2, 3, 4]
    base_cost: { wood: 60, stone: 80, ore: 20 }
    jobs: [1, 1, 2, 2, 3]            # guard slots (BALANCE §2.3); guards get +15% per level (waves.yaml)

  watchtower:
    name: Watchtower
    description: Looses arrows at raiders within 7 tiles. Harder hitting each level.
    category: defence
    unlock_town_hall: 3
    footprint: [1, 1]
    max_count: [0, 0, 1, 2, 3]
    base_cost: { wood: 80, stone: 100 }
    tower_dmg: [6, 9, 13, 18, 24]    # per arrow, one every 1.2 s (waves.yaml → towers)

  # ── Phase 14: decorations. Placed instantly, no levels; `beauty` feeds the village's beauty score ──
  # Deco sets unlock with the Town Hall: Rustic (1), Garden (2), Festival (3), Noble (4).
  # Blueprint decorations (from delves) use up one blueprint each.
  path_dirt:
    name: Dirt Path
    description: A trodden path. Link buildings to the Town Hall with paths for beauty.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [120, 160, 200, 240, 300]
    base_cost: { coins: 2 }
    walkable: true
  path_stone:
    name: Stone Path
    description: Neat flagstones. Counts as a path, and looks it.
    category: decoration
    unlock_town_hall: 2
    footprint: [1, 1]
    max_level: 1
    max_count: [0, 160, 200, 240, 300]
    base_cost: { stone: 4, coins: 3 }
    walkable: true
    beauty: 0.2
  flower_bed:
    name: Flower Bed
    description: A little riot of colour.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [12, 18, 24, 30, 40]
    base_cost: { wood: 4, coins: 15 }
    beauty: 2
  hedge:
    name: Hedge
    description: Clipped and proud of it.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [20, 30, 40, 50, 60]
    base_cost: { wood: 3, coins: 8 }
    beauty: 1
  bench:
    name: Bench
    description: Somewhere to sit and watch the chickens.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [6, 9, 12, 15, 20]
    base_cost: { wood: 12, coins: 10 }
    beauty: 1
  lantern:
    name: Lantern
    description: A warm light for the walk home.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [8, 12, 16, 20, 26]
    base_cost: { wood: 6, ore: 2, coins: 15 }
    beauty: 1.5
  young_tree:
    name: Young Tree
    description: Plant one now, sit under it later.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [10, 15, 20, 25, 30]
    base_cost: { wood: 5, coins: 12 }
    beauty: 1.5
  well:
    name: Well
    description: Fresh water and the best gossip in the village.
    category: decoration
    unlock_town_hall: 2
    footprint: [2, 2]
    max_level: 1
    max_count: [0, 1, 2, 2, 3]
    base_cost: { stone: 60, wood: 20, coins: 80 }
    beauty: 4
  banner:
    name: Banner
    description: Your colours, flying high.
    category: decoration
    unlock_town_hall: 2
    footprint: [1, 1]
    max_level: 1
    max_count: [0, 6, 10, 14, 18]
    base_cost: { wood: 8, coins: 30 }
    beauty: 2
  market_stall:
    name: Market Stall
    description: Mostly sells turnips. Mostly.
    category: decoration
    unlock_town_hall: 3
    footprint: [2, 1]
    max_level: 1
    max_count: [0, 0, 3, 4, 6]
    base_cost: { wood: 40, coins: 120 }
    beauty: 3
  pumpkins:
    name: Pumpkin Pile
    description: A seasonal heap of pumpkins. Festive!
    category: decoration
    unlock_town_hall: 3
    footprint: [1, 1]
    max_level: 1
    max_count: [0, 0, 6, 8, 10]
    base_cost: { food: 30, coins: 40 }
    beauty: 3
  fountain:
    name: Fountain
    description: The village's pride, splashing away.
    category: decoration
    unlock_town_hall: 4
    footprint: [2, 2]
    max_level: 1
    max_count: [0, 0, 0, 1, 2]
    base_cost: { stone: 200, coins: 600 }
    beauty: 8
  statue:
    name: Statue
    description: A hero of old. Possibly you, if you squint.
    category: decoration
    unlock_town_hall: 4
    footprint: [1, 1]
    max_level: 1
    max_count: [0, 0, 0, 2, 4]
    base_cost: { stone: 150, coins: 450 }
    beauty: 6
  lantern_post:
    name: Lantern Post
    description: A tall wrought lamp from a delve blueprint.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [4, 6, 8, 10, 12]
    base_cost: { ore: 10, coins: 40 }
    requires_item: blueprint_lantern_post
    beauty: 3
  stone_fountain:
    name: Stone Fountain
    description: An old delve design, carved with runes. Water glows faintly at night.
    category: decoration
    footprint: [2, 2]
    max_level: 1
    max_count: [1, 1, 2, 2, 3]
    base_cost: { stone: 120, coins: 200 }
    requires_item: blueprint_stone_fountain
    beauty: 10
  hedge_arch:
    name: Hedge Arch
    description: An archway of clipped hedge. Walk right through it.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [4, 6, 8, 10, 12]
    base_cost: { wood: 20, coins: 60 }
    requires_item: blueprint_hedge_arch
    walkable: true
    beauty: 4
  banner_pole:
    name: Banner Pole
    description: A tall pole with your colours. Visible from the next village.
    category: decoration
    footprint: [1, 1]
    max_level: 1
    max_count: [4, 6, 8, 10, 12]
    base_cost: { wood: 30, coins: 60 }
    requires_item: blueprint_banner_pole
    beauty: 3
