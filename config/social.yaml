# Co-op rules (Phase 9) and the social layer (Phase 15): friends, gifts, likes, visits, help, chat, pings.

realm:
  max_members: 10                  # one per plot on the ring
  name_min: 3
  name_max: 24

stash:                             # the shared realm stash (P3: nobody can just empty it)
  capacity: 60
  newcomer_deposit_only: 48h       # members in their first 48 h can only deposit
  untrusted_daily_value: 400       # coins' worth an untrusted member may take out per UTC day
  default_item_value: 10           # per unit, for items the market doesn't price
  gear_value_per_tier: 60          # forged gear counts as tier × this

party:
  max_size: 4
  xp_share_radius: 16              # tiles: party members this close to a kill get its XP too
  invite_ttl: 60s

fog:
  reveal_radius: 2                 # chunks around your avatar that get revealed (5×5 = 80 tiles across)

waystone:
  attune_radius: 2.5               # walk this close to attune a waystone
  use_radius: 2.5                  # and this close to travel from one

# ── Phase 15 ──────────────────────────────────────────────────────────────────
friends:
  max: 50

gate:                              # P4: brand-new accounts can't send gifts, and their likes don't count,
  level: 5                         # until their avatar reaches this level…
  account_age: 24h                 # …or the account is this old (whichever comes first)

gifts:
  per_friend_per_day: 1
  value_cap: 300                   # one gift is worth at most this many coins (market value)
  daily_value_cap: 900             # and all your gifts in a UTC day at most this much
  max_stacks: 4

likes:
  per_day: 20                      # likes you can hand out per UTC day

help:                              # neighbour help on a friend's or realm-mate's building timer
  cut: 0.25                        # takes this share of the time that's left off
  max_share: 0.5                   # helps can't cut more than half of any one timer
  per_day: 10                      # helps you can give per UTC day
  reward_coins: 10                 # a thank-you per help

chat:                              # no free text: emotes and preset quick messages only (no moderation needed)
  radius: 30
  every: 1s                        # at most one per this, per player
  emotes: [wave, cheer, laugh, heart, angry, sleepy]
  quick: ["Hello!", "Thanks!", "Follow me!", "Help!", "Nice one!", "Over here!", "Good night!", "Let's go!"]

pings:
  every: 3s
  lasts: 8s

mail:
  keep: 30d                        # unclaimed mail is cleared after this
  max: 50

