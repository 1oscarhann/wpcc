# Monsters (BALANCE §6). Roster stats are the final values in their home biome: BALANCE §6.1 archetype
# bases × the §6.2 biome multipliers (biomes.<b>.scale), already applied. `roaming` enemies (the Storm
# Elemental) carry difficulty-1 stats and get the scale of whatever biome they turn up in.
# Elites multiply hp/dmg and drop more. Every player in range gets their own loot rolls (BALANCE §6.4).
# Night (world_clock.yaml → night) buffs spawns and loot; fog shrinks aggro; storms bring Storm Elementals.
aggro_radius: 6.5            # tiles; a monster notices you inside this (× weather aggro, e.g. fog 0.7)
leash_radius: 13             # tiles from home; further than this and it gives up and walks back
wake_radius_chunks: 2        # spawn points wake when a player is this many chunks away
despawn_after: 60s           # monsters despawn this long after nobody is near
respawn: 75s                 # a spawn point refills this long after its group is wiped
elite: { hp: 4.0, dmg: 1.6, scale: 1.3, xp: 5, loot_rolls: 3, knockback_resist: 0.7 }
coop: { hp_per_player: 0.5, radius: 20 }   # HP × (1 + 0.5 × extra players within 20 tiles of the spawn)
storm_enemy: storm_elemental
minion_xp: 0.25              # summoned minions: a quarter of the XP, no coins, no loot

biomes:
  meadow:
    { difficulty: 1, groups_per_chunk: 0.30, elite_chance: 0.06, xp: 8, coins: [1, 3], scale: { hp: 1, dmg: 1, defence: 0 },
      roster: { slime: 0.55, big_slime: 0.15, thornhare: 0.15, buzzling: 0.15 } }
  forest:
    { difficulty: 2, groups_per_chunk: 0.75, elite_chance: 0.08, xp: 22, coins: [3, 6], scale: { hp: 2, dmg: 1.8, defence: 2 },
      roster: { wolf: 0.35, spider: 0.25, bandit_archer: 0.15, bandit_brute: 0.12, sapling: 0.13 } }
  stonepeak:
    { difficulty: 3, groups_per_chunk: 0.85, elite_chance: 0.09, xp: 50, coins: [6, 12], scale: { hp: 4, dmg: 3, defence: 6 },
      roster: { rock_golem: 0.2, ram_goat: 0.22, harpy: 0.2, crystal_sprite: 0.13, pebbling: 0.25 } }
  swamp:
    { difficulty: 4, groups_per_chunk: 0.90, elite_chance: 0.10, xp: 95, coins: [10, 20], scale: { hp: 6.5, dmg: 4.5, defence: 10 },
      roster: { bog_lurker: 0.22, toad_spitter: 0.2, leechling: 0.25, mire_shaman: 0.13, snapjaw: 0.2 } }
  frozen:
    { difficulty: 5, groups_per_chunk: 0.95, elite_chance: 0.11, xp: 170, coins: [15, 30], scale: { hp: 10, dmg: 6.5, defence: 16 },
      roster: { ice_wraith: 0.2, frost_wolf: 0.27, yeti: 0.15, snow_imp: 0.2, rime_stalker: 0.18 } }
  ashen:
    { difficulty: 6, groups_per_chunk: 1.00, elite_chance: 0.12, xp: 300, coins: [25, 45], scale: { hp: 14, dmg: 9, defence: 24 },
      roster: { fire_imp: 0.25, magma_hound: 0.22, ash_golem: 0.15, cinder_witch: 0.13, ember_archer: 0.25 } }

